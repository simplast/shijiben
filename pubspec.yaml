name: shijiben
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0-228.0.dev

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Drift (SQLite) for local persistence
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.24

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Fonts
  google_fonts: ^6.3.3

  # Path utilities & platform directories
  path: ^1.9.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drift code generation
  drift_dev: ^2.16.0
  build_runner: ^2.4.11

  flutter_lints: ^6.0.0

# google_fonts >=6.3.1 advertises a min Flutter SDK that the pub solver rejects
# when our Flutter framework reports an older version, so we pin the exact
# version that fixes the const FontWeight map bug.
dependency_overrides:
  google_fonts: 6.3.3

flutter:
  uses-material-design: true
